<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de Gastos 💰</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">


  <h1>Gestor de Gastos 💵</h1>

  <form id="form-gasto">
    <div>
        <label for="gasto">Monto:</label>
            <input type="number" id="gasto" placeholder="Ej: 10000" required>
    </div>
    <div>
        <label for="fecha">Fecha (Día:)</label>
             <input type="number" id="fecha" min="0" max="31" placeholder="Ej: 10" required>
    </div>

    <div>
        <label for="semana">Semana:</label>
            <select id="semana" required>
                <option value="semana1">Semana 1</option>
                <option value="semana2">Semana 2</option>
                <option value="semana3">Semana 3</option>
                <option value="semana4">Semana 4</option>
            </select>
    </div>
        <button type="submit">Agregar Gasto</button>

  </form>

  <hr>
  </div>

  <section>
    <h2>Resumen de Gastos</h2>
    <div id="contenedor-totales"></div>
    <h3>Total Septiembre: <span id="total-mes">0</span> Bolívares</h3>
  </section>

<script src="script.js"></script>

</body>
</html>
